services:
  postgres:
    image: postgres:16-alpine
    container_name: pagasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagasa
      POSTGRES_PASSWORD: pagasa
      POSTGRES_DB: pagasa
    ports:
      # POSTGRES_HOST_PORT lets you remap the host-side port if 5432 is already
      # taken by another local Postgres. Defaults to 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pagasa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagasa -d pagasa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagasa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # API_HOST_PORT lets you remap the host-side port if 8080 is taken by
      # another project. Defaults to 8080.
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://pagasa:pagasa@postgres:5432/pagasa?sslmode=disable"
      PUBLIC_BASE_URL: "http://localhost:8080"
      CORS_ALLOWED_ORIGIN: "http://localhost:3000"
      # Stripe values are read from .env (see .env.example). Compose substitutes
      # ${VAR} from the .env file in this directory.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_placeholder}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-http://localhost:3000/camp/registration/success?session_id={CHECKOUT_SESSION_ID}}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-http://localhost:3000/camp/registration/cancelled}"
      # SMTP values are also read from .env. Leave SMTP_HOST blank to fall back
      # to the no-op mailer that just logs the email instead of sending it.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Resend HTTPS API (preferred for hosts that block SMTP, e.g. Railway).
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      # Google Sheets live sync. Leave any of these blank to disable.
      GOOGLE_SERVICE_ACCOUNT_JSON: "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
      GOOGLE_SHEETS_SPREADSHEET_ID: "${GOOGLE_SHEETS_SPREADSHEET_ID:-}"
      GOOGLE_SHEETS_PENDING_TAB: "${GOOGLE_SHEETS_PENDING_TAB:-Pending}"
      GOOGLE_SHEETS_PAID_TAB: "${GOOGLE_SHEETS_PAID_TAB:-Paid}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      ADMIN_SECURE_COOKIE: "${ADMIN_SECURE_COOKIE:-0}"
      WHITE_TEAM_EMAIL: "${WHITE_TEAM_EMAIL:-}"
      INVOICE_DUE_DAYS: "${INVOICE_DUE_DAYS:-15}"
      STRIPE_PRICE_LODGE: "${STRIPE_PRICE_LODGE:-}"
      STRIPE_PRICE_CABIN: "${STRIPE_PRICE_CABIN:-}"
      STRIPE_PRICE_STATIC_CARAVAN: "${STRIPE_PRICE_STATIC_CARAVAN:-}"
      STRIPE_PRICE_POD: "${STRIPE_PRICE_POD:-}"
      STRIPE_PRICE_TENT: "${STRIPE_PRICE_TENT:-}"
      STRIPE_PRICE_CHILD_3_12: "${STRIPE_PRICE_CHILD_3_12:-}"
      STRIPE_PRICE_CHILD_UNDER3: "${STRIPE_PRICE_CHILD_UNDER3:-}"

volumes:
  pagasa_pgdata:
